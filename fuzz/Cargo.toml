[package]
name = "rampspec-contract-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
evidence-registry = { path = "../contracts/evidence-registry" }
libfuzzer-sys = "=0.4.13"
policy-account-fixture = { path = "../contracts/policy-account-fixture" }
rampspec-shared-types = { path = "../crates/shared-types" }
soroban-sdk = { version = "=27.0.0", features = ["testutils"] }

[[bin]]
name = "decode_evidence"
path = "fuzz_targets/decode_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_configuration"
path = "fuzz_targets/policy_configuration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_transitions"
path = "fuzz_targets/registry_transitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evidence_id_encoding"
path = "fuzz_targets/evidence_id_encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upgrade_inputs"
path = "fuzz_targets/upgrade_inputs.rs"
test = false
doc = false
bench = false

[workspace]
