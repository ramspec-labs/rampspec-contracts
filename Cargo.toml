[workspace]
members = [
  "contracts/evidence-registry",
  "contracts/policy-account-fixture",
  "contracts/web-auth-fixture",
  "crates/shared-types",
  "crates/test-support",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93.1"
version = "0.1.0"

[workspace.dependencies]
soroban-sdk = "=27.0.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
