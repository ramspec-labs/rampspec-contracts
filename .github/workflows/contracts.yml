name: Contract quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@779680da3a8892f488a7ff267b26f128a2f5dc9a # v2.8.2
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo metadata --locked --format-version 1 --no-deps
      - run: node --test scripts/fixture-manifest-core.test.mjs
      - run: node --test scripts/deployment-manifest-core.test.mjs scripts/upgrade-rehearsal-core.test.mjs scripts/security-review-core.test.mjs
      - run: node scripts/validate-fixture-manifest.mjs
      - run: node scripts/prepare-security-review.mjs
      - run: node --test scripts/security-readiness-core.test.mjs
      - run: node --test scripts/release-core.test.mjs
      - run: node --test scripts/pubnet-decision-core.test.mjs
      - run: node scripts/verify-security-readiness.mjs --allow-pending
      - run: node scripts/verify-pubnet-decision.mjs

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@779680da3a8892f488a7ff267b26f128a2f5dc9a # v2.8.2
      - run: cargo install --locked stellar-cli --version 27.1.0
      - run: bash scripts/build-reproducible.sh
      - run: bash scripts/build-reproducible.sh artifacts/repeat-wasm
      - run: diff -u artifacts/wasm/checksums.sha256 artifacts/repeat-wasm/checksums.sha256
      - run: node scripts/verify-fixture-isolation.mjs artifacts/wasm
      - run: node scripts/verify-resource-budgets.mjs artifacts/wasm
      - run: |
          if [ -f scripts/verify-generated.sh ]; then bash scripts/verify-generated.sh; fi
          if [ -f fuzz/Cargo.toml ]; then
            cargo install --locked cargo-fuzz --version 0.13.2
            (cd fuzz && cargo fuzz check)
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-wasm-${{ github.sha }}
          path: artifacts/wasm/*.wasm
          if-no-files-found: error
