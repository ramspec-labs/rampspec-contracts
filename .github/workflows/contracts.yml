name: Contract quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Install pinned Stellar CLI on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          STELLAR_CLI_SHA256: b41ff3d28b21e57d5b9fdfed10975b1a7639af7416025287f12f36f218594bfe
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'stellar-cli-27.1.0-x86_64-pc-windows-msvc.tar.gz'
          Invoke-WebRequest -Uri 'https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-pc-windows-msvc.tar.gz' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $env:STELLAR_CLI_SHA256) { throw 'Stellar CLI checksum mismatch' }
          tar -xzf $archive -C $env:RUNNER_TEMP stellar.exe
          $cargoBin = Join-Path $HOME '.cargo\bin'
          New-Item -ItemType Directory -Path $cargoBin -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'stellar.exe') -Destination (Join-Path $cargoBin 'stellar.exe') -Force
          stellar --version
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo metadata --locked --format-version 1 --no-deps
      - run: node --test scripts/fixture-manifest-core.test.mjs
      - run: node --test scripts/deployment-manifest-core.test.mjs scripts/upgrade-rehearsal-core.test.mjs scripts/security-review-core.test.mjs
      - run: node scripts/validate-fixture-manifest.mjs
      - run: node scripts/prepare-security-review.mjs
      - run: node --test scripts/security-readiness-core.test.mjs
      - run: node --test scripts/release-core.test.mjs
      - run: node --test scripts/pubnet-decision-core.test.mjs
      - run: node --test scripts/operations-core.test.mjs
      - run: node scripts/verify-security-readiness.mjs --allow-pending
      - run: node scripts/verify-pubnet-decision.mjs
      - run: node scripts/verify-operations.mjs
      - name: Verify generated contract interfaces on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/verify-generated.ps1

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Install pinned Stellar CLI
        env:
          STELLAR_CLI_SHA256: 9915fe63753d7154c26bb9e6410cf1d1ff9727a9b378e663c2790ab7a266af94
        run: |
          archive="$RUNNER_TEMP/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$STELLAR_CLI_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/stellar" "$HOME/.cargo/bin/stellar"
          stellar --version
      - run: bash scripts/build-reproducible.sh
      - run: bash scripts/build-reproducible.sh artifacts/repeat-wasm
      - run: diff -u artifacts/wasm/checksums.sha256 artifacts/repeat-wasm/checksums.sha256
      - run: node scripts/verify-fixture-isolation.mjs artifacts/wasm
      - run: node scripts/verify-resource-budgets.mjs artifacts/wasm
      - run: |
          if [ -f scripts/verify-generated.sh ]; then bash scripts/verify-generated.sh; fi
          if [ -f fuzz/Cargo.toml ]; then
            cargo install --locked cargo-fuzz --version 0.13.2
            (cd fuzz && cargo fuzz check)
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-wasm-${{ github.sha }}
          path: artifacts/wasm/*.wasm
          if-no-files-found: error
