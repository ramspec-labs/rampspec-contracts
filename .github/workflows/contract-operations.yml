name: Contract operations

on:
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test scripts/operations-core.test.mjs
      - run: node scripts/verify-operations.mjs --report artifacts/operations/report.json
      - run: node scripts/verify-pubnet-decision.mjs
      - run: node scripts/verify-security-readiness.mjs --allow-pending
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-operations-${{ github.run_id }}
          path: artifacts/operations/report.json
          if-no-files-found: error
